name: Windows local browser offline verification

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-browser-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-browser:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      JEV_LOCAL_HEADED_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Root fixture browser and official backend browser have independent pinned driver versions.
      - run: node node_modules/playwright/cli.js install chromium
      - name: Install the official backend browser using its own resolved driver
        run: |
          node -e "const {createRequire}=require('node:module');const {join,dirname}=require('node:path');const nested=createRequire(require.resolve('@playwright/mcp/package.json'));const driver=join(dirname(nested.resolve('playwright/package.json')),'cli.js');require('node:child_process').execFileSync(process.execPath,[driver,'install','chromium'],{stdio:'inherit'});"
      - name: Verify disposable Windows private-directory ACL
        run: node scripts/diagnostics/windows-private-directory.mjs
      - run: npm run build
      - run: npm run typecheck
      - run: node --test dist/tests/unit/local-browser*.test.js dist/tests/unit/private-directory.test.js
      - run: node --test --test-concurrency=1 dist/tests/integration/local-browser*.test.js
      - run: node scripts/setup-local-browser.mjs --no-build --print-config --mode extension --browser msedge
      # These are real browser processes on the hosted Windows runner with offline decision stubs.
      # They do not claim acceptance on the user's physical Windows machine or existing daily profile.
