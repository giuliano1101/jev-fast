name: Offline verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # S6 secret-file protections intentionally target macOS /private/tmp.
    # macos-14 is in scheduled brownout and retires 2026-11-02.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      - run: python3 -m pip install --no-deps --require-hashes --only-binary=:all: --target .runtime/python-packages -r scripts/requirements-windows.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: python3 -m unittest discover -s deploy/network/tests -v
      - run: python3 -m unittest discover -s tests/native -p test_macos_driver.py -v
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:safety
      # Never run bench/live/smoke.js or run.js here. No paid API secrets in CI.

  windows-executors:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      - run: python -m pip install --no-deps --require-hashes --only-binary=:all: --target .runtime/python-packages -r scripts/requirements-windows.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Native visible-window acceptance runs locally. Hosted CI does not claim an interactive desktop.
      - run: node --test --test-concurrency=1 dist/tests/unit/windows-recovery.test.js dist/tests/integration/windows*.test.js
      # Never run bench/windows/live.js in CI; it makes real paid Jev calls.
