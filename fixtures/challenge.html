<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Synthetic Challenge</title>
<style>body{font:17px system-ui;margin:24px;background:#f5f7fb;color:#172334}main{max-width:950px;margin:auto}h1{font-size:25px}#instruction{background:#e6eefb;padding:18px;border-radius:10px}#workspace{display:grid;gap:14px}article,.panel{padding:18px;background:white;border:1px solid #ccd4df;border-radius:8px}button,input,select{font:inherit;padding:10px;margin:8px}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}label{display:block}#status{padding:12px;background:#eaf1ed}.below{margin-top:950px}#workspace.cards{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:700px){#workspace.cards{grid-template-columns:1fr}}</style></head>
<body><main data-revision="0"><h1>Local Synthetic Challenge</h1><p>Practice data only. Nothing is sent outside this local page.</p><p id="instruction"></p><section id="workspace"></section><p id="status" role="status">In progress</p></main>
<script>
(()=>{'use strict';
const q=new URLSearchParams(location.search);const family=q.get('family');const difficulty=q.get('difficulty');const seed=Number(q.get('seed'));const mode=q.get('mode');const run=q.get('run');
const main=document.querySelector('main'),workspace=document.querySelector('#workspace'),instruction=document.querySelector('#instruction'),status=document.querySelector('#status');
let rng=(seed*2654435761)>>>0;function random(){rng=(Math.imul(rng,1664525)+1013904223)>>>0;return rng/4294967296;}function opaque(){return 'n'+Math.floor(random()*0xffffffff).toString(36)+'_'+(++nodeCount).toString(36);}let nodeCount=0;
function shuffled(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pageStart=Date.now(),pagePerf=performance.now();let readyAt=null,readyPerf=null,completedAt=null,completedPerf=null,success=false,wrong=0,actions=0,completeCount=0,stage=0,revision=0;const interactions=[];
const expectedName=`Sample-${seed}`,category=['beta','alpha','gamma'][(seed-1)%3];let sampleName='',selectedCategory='',checked=false,opened=false;
function bump(){main.dataset.revision=String(++revision);}
function oracle(){return {family,difficulty,seed,mode,run,page_start_at:pageStart,ready_at:readyAt,completed_at:completedAt,elapsed_ms:completedPerf===null?null:Math.round(completedPerf-readyPerf),page_elapsed_ms:Math.round((completedPerf??performance.now())-pagePerf),success,wrong_actions:wrong,actions,complete_count:completeCount,recovered:success&&wrong>0,interactions:[...interactions],final_state:{stage,sample_name:sampleName,category:selectedCategory,checked,opened}};}
Object.defineProperty(window,'challengeOracle',{value:oracle,writable:false});
function report(){const body=JSON.stringify(oracle());if(navigator.sendBeacon)navigator.sendBeacon('/events',new Blob([body],{type:'application/json'}));else fetch('/events',{method:'POST',headers:{'content-type':'application/json'},body,keepalive:true}).catch(()=>{});}
function ready(){if(readyAt===null){readyAt=Date.now();readyPerf=performance.now();}report();}
function bad(){if(success)return;wrong++;status.textContent=`Try again. Wrong actions: ${wrong}.`;bump();report();}
function finish(){if(success)return;if(family==='locate'?!opened:sampleName!==expectedName||(difficulty!=='easy'&&selectedCategory!==category)||(difficulty==='hard'&&!checked)){bad();return;}success=true;completeCount++;completedAt=Date.now();completedPerf=performance.now();status.textContent=`Completed. Elapsed: ${Math.round(completedPerf-readyPerf)} ms. Wrong actions: ${wrong}.`;bump();report();}
function control(tag,text){const el=document.createElement(tag);el.dataset.ref=opaque();if(text)el.textContent=text;return el;}
function button(text,fn){const el=control('button',text);el.type='button';el.addEventListener('click',()=>{if(!success)fn();});return el;}
function field(labelText,tag){const label=document.createElement('label');label.append(document.createTextNode(labelText));const el=control(tag);el.id=opaque();label.htmlFor=el.id;workspace.append(label,el);return el;}
function renderLocate(){workspace.replaceChildren();workspace.className='cards';
 if(stage===1){workspace.className='';const panel=document.createElement('article');panel.textContent=`Review ${expectedName}. Status: Ready. Owner: Morgan.`;for(const label of shuffled(['Mark reviewed','Archive item','Mark pending']))panel.append(button(label,()=>label==='Mark reviewed'?finish():bad()));workspace.append(panel);bump();return;}
 const records=difficulty==='easy'?[{name:expectedName},{name:`Sample-${seed+10}`},{name:`Sample-${seed}-copy`},{name:`Sample-${seed+1}`}]:[
  {name:expectedName,status:'Ready',owner:'Morgan'}, {name:expectedName,status:'Pending',owner:'Morgan'}, {name:expectedName,status:'Ready',owner:'Jordan'}, {name:`Sample-${seed}-copy`,status:'Ready',owner:'Morgan'}, {name:`Sample-${seed+10}`,status:'Ready',owner:'Morgan'}, {name:expectedName,status:'Archived',owner:'Morgan'}];
 for(const item of shuffled(records)){const card=document.createElement('article');const name=document.createElement('p');name.textContent=`Name: ${item.name}`;card.append(name);if(item.status){const details=document.createElement('p');details.textContent=`Status: ${item.status} | Owner: ${item.owner}`;card.append(details);}card.append(button(difficulty==='easy'?`Open ${item.name}`:'Open',()=>{if(item.name!==expectedName||(difficulty!=='easy'&&(item.status!=='Ready'||item.owner!=='Morgan'))){bad();return;}opened=true;if(difficulty==='hard'){stage=1;renderLocate();report();}else finish();}));workspace.append(card);}bump();}
function renderForm(){workspace.replaceChildren();workspace.className='';
 if(stage===0){const input=field('Sample name','input');input.type='text';input.autocomplete='off';input.value=sampleName;input.addEventListener('input',()=>{sampleName=input.value;bump();});
  if(difficulty!=='easy'){const select=field('Category','select');for(const value of ['',...shuffled(['alpha','beta','gamma'])]){const option=document.createElement('option');option.value=value;option.textContent=value||'Choose category';select.append(option);}select.value=selectedCategory;select.addEventListener('change',()=>{selectedCategory=select.value;bump();});}
  workspace.append(button(difficulty==='easy'?'Save':'Next',()=>{if(sampleName!==expectedName||(difficulty!=='easy'&&selectedCategory!==category)){bad();return;}if(difficulty==='easy')finish();else{stage=1;renderForm();report();}}));
  workspace.append(button('Discard sample',bad));
 }else{const preview=document.createElement('p');preview.textContent=`Review sample: ${sampleName}. Category: ${selectedCategory}.`;workspace.append(preview);const final=document.createElement('section');final.className=difficulty==='hard'?'panel below':'panel';const heading=document.createElement('p');heading.textContent=difficulty==='hard'?'Final confirmation below: check the details, then confirm save.':'Confirm the sample details.';final.append(heading);
  const confirm=button('Confirm save',finish);if(difficulty==='hard'){const label=document.createElement('label');const box=control('input');box.type='checkbox';box.id=opaque();box.checked=checked;label.htmlFor=box.id;label.append(box,document.createTextNode('I checked the sample details'));final.append(label);confirm.disabled=!checked;box.addEventListener('change',()=>{checked=box.checked;confirm.disabled=!checked;bump();});}for(const item of shuffled([confirm,button('Reject sample',bad)]))final.append(item);workspace.append(final);
 }bump();}
for(const type of ['click','input','change'])document.addEventListener(type,event=>{if(success||!(event.target instanceof Element)||!event.target.closest('[data-ref]'))return;actions++;if(interactions.length<256)interactions.push({kind:type,at_ms:Math.round(performance.now()-pagePerf)});queueMicrotask(report);},true);
let scrollPending=false;document.addEventListener('scroll',()=>{if(success||scrollPending)return;scrollPending=true;actions++;if(interactions.length<256)interactions.push({kind:'scroll',at_ms:Math.round(performance.now()-pagePerf)});report();setTimeout(()=>{scrollPending=false;},100);});
if(family==='locate'){instruction.textContent=difficulty==='easy'?`Click the button labeled exactly “Open ${expectedName}”.`:`Open the card with Name: ${expectedName}; Status: Ready; Owner: Morgan.${difficulty==='hard'?' Then choose “Mark reviewed”. The list refreshes once shortly after loading.':''}`;renderLocate();ready();if(difficulty==='hard')setTimeout(()=>{if(stage===0&&!success){renderLocate();report();}},250);
}else{instruction.textContent=`Enter ${expectedName} as the Sample name.${difficulty==='easy'?' Then Save.':` Choose category ${category}, then Next and Confirm save.`}${difficulty==='hard'?' Controls load after a short wait. On the review screen, scroll down, check “I checked the sample details”, then Confirm save.':''}`;
 if(difficulty==='hard'){workspace.textContent='Loading controls… Please wait.';bump();setTimeout(()=>{renderForm();ready();},800);}else{renderForm();ready();}}
})();
</script></body></html>
